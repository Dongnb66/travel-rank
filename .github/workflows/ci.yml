name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run smoke test
        working-directory: backend
        run: node --experimental-sqlite test_smoke.mjs

      - name: Run agent ReAct decision-loop test
        # 用 fetch 桩把模型换成可控脚本，断言「自主决策」语义：
        # tool_choice=auto / 多轮工具调用 / 模型说停才停 / 4 轮上限防失控 / 报错降级
        working-directory: backend
        run: node --experimental-sqlite test_agent_react.mjs

      - name: Run TC3 signature vector test
        working-directory: backend
        run: node test_tc3_signature.mjs
