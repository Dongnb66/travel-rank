name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run smoke test
        working-directory: backend
        run: node --experimental-sqlite test_smoke.mjs

      - name: Run TC3 signature vector test
        working-directory: backend
        run: node test_tc3_signature.mjs
