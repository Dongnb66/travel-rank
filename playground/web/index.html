<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>途见 · 可溯源旅游口碑榜</title>
<style>
 :root{--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--blue:#2563eb;--amber:#b45309}
 body{font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;margin:0;background:#f8fafc;color:var(--ink)}
 .wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
 header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
 h1{font-size:22px;margin:6px 0} h2{font-size:15px;margin:0 0 8px}
 .stats{color:var(--mut);font-size:13px}
 .sliderbox{margin:10px 0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
 .sliderbox input[type=range]{flex:1;min-width:200px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
 .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
 .rank{position:absolute;top:-10px;left:12px;background:var(--blue);color:#fff;border-radius:999px;font-size:12px;padding:2px 10px}
 .rank.r1{background:#d97706}.rank.r2{background:#64748b}.rank.r3{background:#92400e}
 .heatrow{display:flex;align-items:baseline;gap:8px;cursor:pointer}
 .heat{font-size:26px;font-weight:800;color:var(--amber)}
 .bar{height:6px;background:#f1f5f9;border-radius:3px;margin:6px 0 10px;overflow:hidden}
 .bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#d97706)}
 .chip{display:inline-block;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:999px;padding:2px 10px;margin:2px;cursor:pointer}
 .chip.hot{background:#dcfce7;font-weight:700}
 .small{font-size:12px;color:var(--mut)}
 .ev{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
 .ev table{border-collapse:collapse;width:100%;font-size:12px}
 .ev td,.ev th{border:1px solid var(--line);padding:3px 6px;text-align:left}
 .ev .hl{background:#fef9c3}
 button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;margin:4px 4px 0 0}
 button.ghost{background:#fff;color:var(--blue);border:1px solid #bfdbfe}
 label{display:block;font-size:13px;margin:8px 0 4px}
 input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:6px;padding:8px;font-size:13px;font-family:inherit}
 textarea{min-height:60px}
 .row{display:flex;gap:10px}.row>div{flex:1}
 .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
 .msg{border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
 .msg.user{background:#dbeafe}.msg.bot{background:#f3f4f6}
 .err{color:#b91c1c}
 .pbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
 .pbar i{height:10px;background:#93c5fd;border-radius:2px}
 .pbar.best i{background:#2563eb}
</style>
</head>
<body>
<div class="wrap">
<header><h1>途见 · 可溯源旅游口碑榜</h1><span class="stats" id="stats"></span></header>
<div class="small">热度 = 发帖数×2 + 投票×3 + 平均评分×5，置顶优先。<b>点热度值或优点标签看证据链</b>——每个数字都能拆回原帖。拖动时间轴看口碑演变。演示发帖/点赞存浏览器本地，不写公开库。</div>
<div class="sliderbox"><span class="small">榜单演变</span><input type="range" id="asof" min="1" max="18" value="18"><b id="asof-label">截至 11-18</b><button class="ghost" onclick="resetDemo()">清空演示视图</button></div>
<div class="grid" id="board"></div>

<div class="panel"><h2>发一篇分享（进我的演示视图）</h2>
<div class="row"><div><label>地点</label><select id="p-loc"></select></div>
<div><label>署名</label><input id="p-author" placeholder="演示游客"></div>
<div><label>评分 1-5</label><input id="p-rating" value="5"></div></div>
<label>标题</label><input id="p-title" placeholder="如：成都美食暴走指南">
<label>内容</label><textarea id="p-content" placeholder="真实体验，别编造~"></textarea>
<label>优点标签（逗号分隔）</label><input id="p-adv" placeholder="美食多, 性价比高">
<button onclick="submitPost()">加入演示视图</button><span id="p-msg" class="small"></span>
</div>

<div class="panel"><h2>比价 + 行程规划</h2>
<div class="row"><div><label>目的地（可多选）</label><select id="pl-locs" multiple size="6"></select></div>
<div><label>每站天数</label><input id="pl-days" value="3"></div>
<div><label>预算（可选）</label><input id="pl-budget" placeholder="如 3000"></div></div>
<button onclick="plan()">规划路线</button><div id="pl-out"></div>
</div>

<div class="panel"><h2>AI 旅行助手</h2>
<div id="chat"></div>
<div class="row"><div><input id="chat-in" placeholder="帮我规划三亚+成都5日游 / 成都小众美食 / 三亚多少钱"></div>
<div style="flex:0"><button onclick="sendChat()">发送</button></div></div>
<div class="small" id="chat-src"></div>
</div>
<div class="small">源码：github.com/Dongnb66/travel-rank · 聚合/规划/ReAct 与本地完整版同源 · 演示数据非真实报价</div>
</div>
<script>
const API='/functions/v1/app/';
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let localPosts=load('travel_posts',[]),localVotes=load('travel_votes',{}),localComments=load('travel_comments',{});
let openEv={},advFilter={};
const asOf=()=>`2026-11-${String(el('asof').value).padStart(2,'0')}`;
async function get(t,q){const r=await fetch(API+t+(q||''));const j=await r.json();if(!j.ok)throw new Error(j.error||'请求失败');return j}
async function post(t,b){const r=await fetch(API+t,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!j.ok)throw new Error(j.error||'请求失败');return j}
function demoActive(){return localPosts.length>0||Object.keys(localVotes).length>0}
async function refresh(){
 el('asof-label').textContent='截至 11-'+el('asof').value;
 const j=demoActive()?await post('preview',{extraPosts:localPosts,localVotes,asOf:asOf()}):await get('leaderboard','?asOf='+asOf());
 renderBoard(j.board);
}
function renderBoard(board){
 const max=Math.max(...board.map(l=>l.heat),1);
 const totP=board.reduce((s,l)=>s+l.postCount,0);
 el('stats').textContent=`${board.length} 地点 · ${totP} 篇分享 · ${demoActive()?'含我的演示视图':'公开种子榜'}`;
 el('board').innerHTML=board.map((l,i)=>{
  const ev=l.evidence;
  const rows=ev.posts.filter(p=>!advFilter[l.id]||p.advantages.includes(advFilter[l.id]));
  return `<div class="card"><span class="rank r${i+1}">#${i+1}</span>
  <h2>${esc(l.name)} <span class="small">${esc(l.city)}·${esc(l.category)}${l.pinned?'·置顶':''}</span></h2>
  <div class="heatrow" onclick="toggleEv('${l.id}')" title="点击拆解热度公式"><span class="heat">${l.heat}</span><span class="small">${l.postCount} 篇 · 点击看证据</span></div>
  <div class="bar"><i style="width:${Math.round(l.heat/max*100)}%"></i></div>
  <div>${l.topAdvantages.map(a=>`<span class="chip${a.freq>=2?' hot':''}" style="font-size:${11+Math.min(a.freq,4)*2}px" onclick="filterAdv('${l.id}','${esc(a.name)}')">${esc(a.name)} ×${a.freq}</span>`).join('')}</div>
  ${openEv[l.id]?`<div class="ev"><b class="small">公式拆解：${ev.posts.length}帖×2 + ${ev.voteSum}票×3 + ${ev.avgRating}分×5 = ${l.heat}</b>${advFilter[l.id]?` <button class="ghost" onclick="filterAdv('${l.id}',null)">清除筛选「${esc(advFilter[l.id])}」</button>`:''}
   <table><tr><th>原帖</th><th>赞</th><th>评分</th><th>日期</th></tr>${rows.map(p=>`<tr class="${advFilter[l.id]?'hl':''}"><td>${esc(p.title)}<span class="small"> ${esc(p.author)}</span></td><td>${p.votes}</td><td>${p.rating??'-'}</td><td>${String(p.created_at).slice(5,10)}</td></tr>`).join('')}</table></div>`:''}
  <div style="margin-top:8px">${l.hotPosts.map(p=>`<div class="small" style="border-top:1px dashed var(--line);padding:6px 0"><b style="color:var(--ink)">${esc(p.title)}</b> ${esc(p.author)}·${p.rating||'-'}分<br>${esc(p.content)}<br><button class="ghost" onclick="tapVote('${p.id}')">赞 ${p.votes}</button><button class="ghost" onclick="openComments('${p.id}')">评论</button><span id="cm-${p.id}"></span></div>`).join('')}</div>
  </div>`;
 }).join('');
}
function toggleEv(id){openEv[id]=!openEv[id];refresh()}
function filterAdv(id,name){advFilter[id]=name||undefined;openEv[id]=true;refresh()}
function tapVote(pid){if(localVotes[pid])delete localVotes[pid];else localVotes[pid]=1;save('travel_votes',localVotes);refresh()}
function submitPost(){
 const title=el('p-title').value.trim(),content=el('p-content').value.trim();
 if(!title||!content){el('p-msg').innerHTML='<span class="err">标题和内容必填</span>';return}
 localPosts.push({locationId:el('p-loc').value,author:el('p-author').value.trim()||'演示游客',title,content,rating:Number(el('p-rating').value)||5,advantages:el('p-adv').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),votes:0});
 save('travel_posts',localPosts);el('p-title').value='';el('p-content').value='';el('p-msg').textContent='已加入演示视图';refresh();
}
function resetDemo(){localPosts=[];localVotes={};localComments={};save('travel_posts',[]);save('travel_votes',{});save('travel_comments',{});refresh()}
async function openComments(pid){
 const box=el('cm-'+pid);
 if(box.dataset.open){box.innerHTML='';delete box.dataset.open;return}
 box.dataset.open='1';
 let comments=[];
 if(!String(pid).startsWith('local-')){try{comments=(await get('comments','?postId='+pid)).comments}catch{}}
 const mine=localComments[pid]||[];
 box.innerHTML=[...comments,...mine].map(c=>`<div class="msg bot"><b>${esc(c.author)}</b>：${esc(c.content)}</div>`).join('')+`<div class="row"><div><input id="ci-${pid}" placeholder="写评论（本地演示）…"></div><div style="flex:0"><button onclick="sendComment('${pid}')">评</button></div></div>`;
}
function sendComment(pid){
 const input=el('ci-'+pid);const content=input.value.trim();if(!content)return;
 (localComments[pid]=localComments[pid]||[]).push({author:el('p-author').value.trim()||'演示游客',content});
 save('travel_comments',localComments);input.value='';delete el('cm-'+pid).dataset.open;openComments(pid);
}
async function plan(){
 const ids=[...el('pl-locs').selectedOptions].map(o=>o.value);
 try{
  const r=await post('plan',{destinations:ids.map(id=>({locationId:id,days:Number(el('pl-days').value)})),budget:el('pl-budget').value?Number(el('pl-budget').value):undefined});
  const maxP=Math.max(...r.stops.flatMap(s=>s.comparison.map(q=>q.price)),1);
  el('pl-out').innerHTML='<p><b>'+esc(r.route.join(' → '))+'</b> · 预计 ¥'+r.totalCost+'</p><p class="small">'+esc(r.recommendation)+'</p>'+
   r.stops.map(s=>'<div class="panel" style="margin:8px 0"><b>'+esc(s.name)+' '+s.days+'天</b>'+s.comparison.map(q=>`<div class="pbar${q.provider===s.chosenProvider?' best':''}"><span style="width:90px">${esc(q.provider)}</span><i style="width:${Math.round(q.price/maxP*240)}px"></i>¥${q.price}/${q.duration_days}天${q.provider===s.chosenProvider?' ✓选中':''}</div>`).join('')+'</div>').join('');
 }catch(e){el('pl-out').innerHTML='<span class="err">'+esc(e.message)+'</span>'}
}
const history=[];
async function sendChat(){
 const text=el('chat-in').value.trim();if(!text)return;
 history.push({role:'user',content:text});
 el('chat').innerHTML+=`<div class="msg user">${esc(text)}</div>`;el('chat-in').value='';
 el('chat-src').textContent='思考中…';
 try{const r=await post('chat',{messages:history});history.push({role:'assistant',content:r.reply});
  el('chat').innerHTML+=`<div class="msg bot">${esc(r.reply)}</div>`;el('chat-src').textContent='来源：'+r.source;
 }catch(e){el('chat-src').innerHTML='<span class="err">'+esc(e.message)+'</span>'}
}
el('asof').addEventListener('input',refresh);
(async()=>{
 const {locations}=await get('locations');
 el('p-loc').innerHTML=locations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('');
 el('pl-locs').innerHTML=locations.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('');
 await refresh();
})().catch(e=>{el('board').innerHTML='<span class="err">'+esc(e.message)+'</span>'});
</script>
</body>
</html>
